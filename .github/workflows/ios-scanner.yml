name: Custom scanner unsigned build and native tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-scanner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-app:
    # manual start only; the build script derives its folder from RUNNER_TEMP/GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out explicitly approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test and build our unsigned application
        shell: bash
        run: bash ios/tools/build_scanner_unsigned.sh
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner3d-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scanner3d-native-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          if-no-files-found: error
          retention-days: 7
